<!doctype html>
<html lang="de"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hinter dem Horizont · Felsenburg</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202923;color:#fff7e4;font:16px system-ui}
canvas{display:block;touch-action:none}header{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;pointer-events:none;background:#17201ee8;padding:12px 16px;border-radius:12px}h1{font:24px Georgia;margin:0 0 5px}
#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;display:grid;grid-template-columns:repeat(3,54px);gap:5px}button{height:54px;background:#18211eea;color:inherit;border:1px solid #b4ac95;border-radius:12px;font:inherit;touch-action:none}#gate{position:fixed;right:16px;bottom:max(25px,env(safe-area-inset-bottom));padding:0 14px}
</style>
<header><h1>Hinter dem Horizont</h1><div id="place">Felsenburg wird geladen …</div></header>
<div id="controls" hidden style="display:none"><span></span><button data-key="w" aria-label="Vorwärts">↑</button><span></span><button data-key="a" aria-label="Links">←</button><button data-key="s" aria-label="Zurück">↓</button><button data-key="d" aria-label="Rechts">→</button></div>
<button id="gate" hidden>Tor öffnen</button>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const place=document.querySelector('#place'), gate=document.querySelector('#gate');
try { await start(); } catch(error) {
  console.error(error);
  place.textContent='Spielstart fehlgeschlagen: '+error.message;
}
async function start(){
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xb7c6ca);
  scene.fog=new THREE.FogExp2(0xb7c6ca,.023);
  const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.035,120);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  document.body.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xe0ecff,0x655b48,.88));
  const sun=new THREE.DirectionalLight(0xffe4c5,2.65);
  sun.position.set(-14,12,6);
  scene.add(sun);
  const gltf=await new GLTFLoader().loadAsync('./Felsenburg.glb');
  const model=gltf.scene;
  const originalNames=new Map();
  model.traverse(object=>{
    const index=gltf.parser.associations.get(object)?.nodes;
    if(index!==undefined)originalNames.set(gltf.parser.json.nodes[index].name,object);
  });
  const facade=originalNames.get('Cube.3326');
  const arch=originalNames.get('Spitzbogen');
  const oldDoor=originalNames.get('Spitzbogen.001');
  if(!facade||!arch||!oldDoor)throw Error('Unerwartete Modellversion');
  facade.visible=arch.visible=oldDoor.visible=false;
  // World-space stone detail also works on meshes exported without UVs.
  function weathered(material, kind){
    material.customProgramCacheKey=()=>kind;
    material.onBeforeCompile=shader=>{
      shader.vertexShader='varying vec3 weatherPosition;\n'+shader.vertexShader.replace(
        '#include <project_vertex>',
        'weatherPosition=(modelMatrix*vec4(transformed,1.0)).xyz;\n#include <project_vertex>');
      const masonry=kind==='masonry';
      shader.fragmentShader=`varying vec3 weatherPosition;
        float weatherHash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
        float weatherNoise(vec3 p){
          vec3 i=floor(p), f=fract(p);
          f=f*f*(3.0-2.0*f);
          return mix(mix(mix(weatherHash(i),weatherHash(i+vec3(1,0,0)),f.x),
                         mix(weatherHash(i+vec3(0,1,0)),weatherHash(i+vec3(1,1,0)),f.x),f.y),
                     mix(mix(weatherHash(i+vec3(0,0,1)),weatherHash(i+vec3(1,0,1)),f.x),
                         mix(weatherHash(i+vec3(0,1,1)),weatherHash(i+vec3(1,1,1)),f.x),f.y),f.z);
        }
      `+shader.fragmentShader.replace('#include <color_fragment>',`
        #include <color_fragment>
        vec3 wp=weatherPosition;
        float coarse=weatherNoise(wp*3.4);
        float fine=weatherNoise(wp*34.0);
        float stains=weatherNoise(wp*vec3(1.9,.58,1.9));
        float shade=.65+.33*coarse+.18*fine;
        ${masonry?`
          vec3 direction=normalize(cross(dFdx(wp),dFdy(wp)));
          float horizontal=abs(direction.x)>abs(direction.z)?wp.z:wp.x;
          float row=floor(wp.y/.23);
          vec2 joint=fract(vec2(horizontal/.43+mod(row,2.0)*.5,wp.y/.23));
          vec2 edge=min(joint,1.0-joint);
          float mortar=1.0-smoothstep(.012,.065,min(edge.x,edge.y)+(coarse-.5)*.09);
          float face=1.0-smoothstep(.4,.85,abs(direction.y));
          shade*=mix(1.0,.49,mortar*face);
        `:`shade*=.68+.45*weatherNoise(wp*vec3(3.0,11.0,3.0));`}
        diffuseColor.rgb*=shade*mix(vec3(.84,.85,.72),vec3(1.12,1.04,.94),stains);
      `);
    };
    return material;
  }
  const dressed=new Set();
  model.traverse(object=>{
    if(!object.isMesh)return;
    for(const material of [object.material].flat()){
      if(dressed.has(material))continue;
      dressed.add(material);
      if(material.name.startsWith('Kalkstein'))weathered(material,'limestone');
      if(material.name==='Fels'||material.name==='Moos'){
        weathered(material,'rock');
        material.flatShading=false;
      }
      if(material.name.includes('Schiefer'))weathered(material,'slate');
    }
  });
  scene.add(model);
  const stone=weathered(new THREE.MeshStandardMaterial({color:0x948b77,roughness:.95}),'masonry');
  const floor=new THREE.MeshStandardMaterial({color:0x6f6757,roughness:.94});
  const oak=new THREE.MeshStandardMaterial({color:0x3c2719,roughness:.82});
  function box(x,y,z,w,h,d,material,parent=scene){
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    mesh.position.set(x,y,z);parent.add(mesh);return mesh;
  }
  box(0,-.17,0,120,.24,120,new THREE.MeshStandardMaterial({color:0x505840}));
  box(0,2.20,.30,2.6,.16,4.4,floor);
  for(const side of [-1,1]){
    box(side*1.08,3.55,.30,.5,2.55,4.4,stone);
    box(side*1.08,6.13,1.72,.5,2.62,1.45,stone);
  }
  box(0,4.94,.30,2.65,.28,4.4,stone);
  box(0,6.10,1.72,2.65,2.32,1.45,stone);
  box(0,3.6,-1.83,2.65,2.65,.2,stone);
  const profile=new THREE.Shape();
  profile.moveTo(0,0);profile.lineTo(1.64,0);profile.lineTo(1.64,1.11);
  profile.quadraticCurveTo(1.64,1.50,.82,2.03);
  profile.quadraticCurveTo(0,1.50,0,1.11);profile.closePath();
  const surround=new THREE.Shape();
  surround.moveTo(-1.33,-.06);surround.lineTo(1.33,-.06);
  surround.lineTo(1.33,2.53);surround.lineTo(-1.33,2.53);surround.closePath();
  const opening=new THREE.Path();
  opening.moveTo(-.82,-.02);opening.lineTo(.82,-.02);opening.lineTo(.82,1.11);
  opening.quadraticCurveTo(.82,1.50,0,2.03);
  opening.quadraticCurveTo(-.82,1.50,-.82,1.11);opening.closePath();
  surround.holes.push(opening);
  const portal=new THREE.Mesh(new THREE.ExtrudeGeometry(surround,{
    depth:.18,bevelEnabled:true,bevelThickness:.035,bevelSize:.035,bevelSegments:2
  }),stone);
  portal.position.set(0,2.28,2.39);
  scene.add(portal);
  const hinge=new THREE.Group();
  hinge.position.set(-.82,2.28,2.44);scene.add(hinge);
  hinge.add(new THREE.Mesh(new THREE.ExtrudeGeometry(profile,{depth:.10,bevelEnabled:false}),oak));
  for(const y of [.32,.83])box(.82,y,.12,1.49,.065,.04,floor,hinge);
  for(const z of [1.45,-.95]){
    const lamp=new THREE.PointLight(0xffac58,6,5,2);
    lamp.position.set(.67,3.95,z);scene.add(lamp);
    box(.73,3.85,z,.13,.23,.14,new THREE.MeshBasicMaterial({color:0xffbb65}));
  }
  const keys=new Set(),touchKeys=new Map();
  addEventListener('keydown',event=>{keys.add(event.key.toLowerCase());if(event.key.toLowerCase()==='e'&&!event.repeat&&!gate.hidden)gate.click();});
  addEventListener('keyup',event=>keys.delete(event.key.toLowerCase()));
  addEventListener('blur',()=>{keys.clear();touchKeys.clear();});
  const controls=document.querySelector('#controls');
  controls.hidden=false;controls.style.display='grid';
  for(const button of controls.querySelectorAll('button')){
    button.onpointerdown=event=>{button.setPointerCapture(event.pointerId);touchKeys.set(event.pointerId,button.dataset.key);};
    button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>touchKeys.delete(event.pointerId);
  }
  let x=0,z=9,yaw=0,pitch=.07,look=null,opened=false;
  const canvas=renderer.domElement;
  canvas.onpointerdown=event=>{if(look!==null)return;look=event.pointerId;canvas.setPointerCapture(look);};
  canvas.onpointermove=event=>{
    if(event.pointerId!==look)return;
    yaw-=event.movementX*.005;
    pitch=THREE.MathUtils.clamp(pitch-event.movementY*.005,-1.16,1.16);
  };
  canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=event=>{if(event.pointerId===look)look=null;};
  gate.onclick=()=>{opened=true;gate.hidden=true;};
  const pressed=(...names)=>names.some(key=>keys.has(key)||[...touchKeys.values()].includes(key));
  function valid(px,pz){
    if(pz>20||pz< -1.52||Math.abs(px)>10)return false;
    if(pz<2.65)return Math.abs(px)<.64&&(opened&&hinge.rotation.y>1.45);
    if(pz<6.97)return Math.abs(px)<.88;
    return true;
  }
  function ground(pz){
    return pz>6.97?-.04:pz<2.39?2.28:.18+2.22*Math.max(0,Math.min(33,Math.floor((6.9-pz)/(.1324))))/33;
  }
  let last=performance.now(),eye=ground(z)+1.65;
  renderer.setAnimationLoop(now=>{
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const f=Number(pressed('w','arrowup'))-Number(pressed('s','arrowdown'));
    const s=Number(pressed('d','arrowright'))-Number(pressed('a','arrowleft'));
    const speed=(z<6.97?1.28:2.2)*dt/Math.max(1,Math.hypot(f,s));
    const nx=x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;
    const nz=z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;
    if(valid(nx,z))x=nx;
    if(valid(x,nz))z=nz;
    if(opened)hinge.rotation.y=Math.min(1.66,hinge.rotation.y+dt*1.7);
    gate.hidden=opened||z>3.38||Math.abs(x)>.7;
    eye=THREE.MathUtils.lerp(eye,ground(z)+1.65,1-Math.exp(-dt*13));
    camera.position.set(x,eye,z);
    camera.rotation.set(pitch,yaw,0,'YXZ');
    const name=z<2.4?'Torhalle':z<6.97?'Freitreppe':'Pfeile oder WASD · Ziehen zum Umsehen';
    if(place.textContent!==name)place.textContent=name;
    renderer.render(scene,camera);
  });
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  });
}
</script>
</html>
