<!doctype html>
<html lang="de"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hinter dem Horizont · Weißes Haus</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202923;color:#fff7e4;font:16px system-ui}
canvas{display:block;touch-action:none}header{max-width:calc(100% - 32px);overflow-wrap:anywhere;position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;pointer-events:none;background:#17201ee8;padding:12px 16px;border-radius:12px}h1{font:24px Georgia;margin:0 0 5px}
#controls{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:16px;display:grid;grid-template-columns:repeat(3,54px);gap:5px}button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;height:54px;background:#18211eea;color:inherit;border:1px solid #b4ac95;border-radius:12px;font:inherit;touch-action:none}#gate{position:fixed;right:16px;bottom:max(25px,env(safe-area-inset-bottom));padding:0 14px}
</style>
<header><h1>Hinter dem Horizont</h1><div id="place">Weißes Haus wird geladen …</div></header>
<div id="controls" hidden style="display:none"><span></span><button data-key="w" aria-label="Vorwärts">↑</button><span></span><button data-key="a" aria-label="Links">←</button><button data-key="s" aria-label="Zurück">↓</button><button data-key="d" aria-label="Rechts">→</button></div>
<button id="gate" hidden>Tür öffnen</button>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const place=document.querySelector('#place'), gate=document.querySelector('#gate');
try { await start(); } catch(error) {
  console.error(error);
  place.textContent='Spielstart fehlgeschlagen: '+error.message;
}
async function start(){
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0xb5ccdf);
  const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.035,160);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  document.body.append(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xe0ecff,0x82745d,1.12));
  const sun=new THREE.DirectionalLight(0xffebd8,2.2);
  sun.position.set(-14,12,6);
  scene.add(sun);
  const {scene:model}=await new GLTFLoader().loadAsync('./Weisses-Haus-Innen.glb');
  scene.add(model);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  sun.position.set(-24,27,34);
  // Camera-centered sky. Only pixels behind the scene need cloud shading.
  const sky = new THREE.Mesh(new THREE.SphereGeometry(125,32,16), new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{
      sunDirection:{value:sun.position.clone().normalize()},
      drift:{value:0}
    },
    vertexShader:`
      varying vec3 ray;
      void main(){
        ray=position;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
      }
    `,
    fragmentShader:`
      varying vec3 ray;
      uniform vec3 sunDirection;
      uniform float drift;

      float hash(vec2 p){
        vec3 q=fract(vec3(p.xyx)*0.1031);
        q+=dot(q,q.yzx+33.33);
        return fract((q.x+q.y)*q.z);
      }
      float noise(vec2 p){
        vec2 i=floor(p), f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
                   mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      float cloudShape(vec2 p){
        return .57*noise(p)+.26*noise(p*2.03+7.2)
             +.12*noise(p*4.21-4.8)+.05*noise(p*8.17+2.4);
      }
      void main(){
        vec3 d=normalize(ray);
        float height=max(d.y,0.0);
        float sun=max(dot(d,sunDirection),0.0);
        vec3 color=mix(vec3(.56,.69,.77),vec3(.095,.31,.59),
                       pow(smoothstep(0.0,.83,height),.56));
        color+=vec3(.28,.20,.10)*pow(sun,14.0);
        if(height>.025){
          vec2 p=d.xz/(height+.16)*2.7+vec2(4.6,7.2)+vec2(drift,drift*.28);
          float shape=cloudShape(p);
          float opacity=smoothstep(.49,.69,shape)*smoothstep(.035,.19,height);
          float shade=smoothstep(.45,.73,cloudShape(p-sunDirection.xz*.27));
          vec3 cloud=mix(vec3(.97,.96,.91),vec3(.61,.67,.75),shade*.82);
          color=mix(color,cloud,opacity*.95);
        }
        color+=vec3(2.3,1.9,1.4)*smoothstep(.99992,.99999,sun);
        gl_FragColor=vec4(color,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  }));
  sky.renderOrder=1000;
  sky.frustumCulled=false;
  scene.add(sky);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-34,right:34,top:30,bottom:-30,near:1,far:95});
  sun.shadow.normalBias=.035;
  model.traverse(o=>{
    if(!o.isMesh)return;
    o.receiveShadow=true;
    o.castShadow=o.material.name!=='Rasen'&&o.material.name!=='Kies';
  });
  // Exterior detail uses the same coordinates as the existing entrance.
  const exterior = new THREE.Group();
  scene.add(exterior);
  const stone = new THREE.MeshStandardMaterial({color:0xe7dfcf,roughness:.77});
  const roof = new THREE.MeshStandardMaterial({color:0x535e59,roughness:.81});
  function surface(x,y,z,w,h,d,material){
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
    mesh.position.set(x,y,z);
    mesh.castShadow=mesh.receiveShadow=true;
    exterior.add(mesh);
  }
  surface(0,14.42,-1,45,.6,22,roof);
  surface(0,15.1,-2,35,.85,16,stone);
  surface(0,15.59,-2,35.6,.22,16.6,roof);
  for(const x of [-17,-10,10,17])for(const z of [-8,5]){
    surface(x,16,z,1.19,2.1,1.05,stone);
    surface(x,17.08,z,1.45,.24,1.32,stone);
  }
  const glass = new THREE.MeshStandardMaterial({color:0x243b4b,roughness:.21,metalness:.12});
  for(const side of [-1,1]){
    surface(side*24.1,14.95,0,.3,.27,24.5,stone);
    for(let i=0;i<33;i++)surface(side*24.1,14.53,-11.9+i*.744,.27,.8,.19,stone);
    for(let z=-9;z<=10;z+=4)for(const [y,h] of [[2.75,2.85],[7.8,2.75],[11.92,1.85]]){
      surface(side*23.59,y,z,.18,h+.22,2.04,stone);
      surface(side*23.7,y,z,.12,h,1.7,glass);
      for(const offset of [-.56,0,.56])surface(side*23.78,y,z+offset,.05,h,.047,stone);
      for(const offset of [-.26,0,.26])surface(side*23.78,y+h*offset,z,.05,.047,1.7,stone);
      surface(side*23.8,y-h/2-.12,z,.41,.17,2.2,stone);
    }
    for(let i=0;i<11;i++)surface(side*7.7,1.2,17.4-i*.45,.13,.67,.155,stone);
    surface(side*7.7,1.57,15.15,.31,.16,4.85,stone);
  }
  for(let x=-20;x<=20;x+=5){
    for(const [y,h] of [[2.75,2.85],[7.8,2.75],[11.92,1.85]]){
      if(x===0&&y<3)continue;
      for(const side of [-1,1])surface(x+side*.97,y,12.24,.13,h+.25,.23,stone);
      surface(x,y+h*.5+.13,12.31,2.26,.14,.4,stone);
    }
  }
  const reflectionCanvas=document.createElement('canvas');
  reflectionCanvas.width=256;
  reflectionCanvas.height=128;
  const paint=reflectionCanvas.getContext('2d');
  const gradient=paint.createLinearGradient(0,0,0,128);
  for(const [offset,color] of [[0,'#568dc1'],[.37,'#a1c4df'],[.50,'#d2dce0'],[.55,'#566047'],[1,'#30392b']]){
    gradient.addColorStop(offset,color);
  }
  paint.fillStyle=gradient;
  paint.fillRect(0,0,256,128);
  const reflection=new THREE.CanvasTexture(reflectionCanvas);
  reflection.colorSpace=THREE.SRGBColorSpace;
  reflection.mapping=THREE.EquirectangularReflectionMapping;
  const pmrem=new THREE.PMREMGenerator(renderer);
  const windowEnvironment=pmrem.fromEquirectangular(reflection);
  reflection.dispose();
  pmrem.dispose();
  function dressGlass(material){
    material.envMap=windowEnvironment.texture;
    material.envMapIntensity=.55;
    material.roughness=.29;
    material.metalness=.17;
  }
  dressGlass(glass);

  function grain(material,scale,strength){
    material.customProgramCacheKey=()=>`grain-${scale}-${strength}`;
    material.onBeforeCompile=shader=>{
      shader.vertexShader='varying vec3 grainPoint;\n'+shader.vertexShader.replace(
        '#include <project_vertex>',
        'grainPoint=(modelMatrix*vec4(transformed,1.0)).xyz;\n#include <project_vertex>');
      shader.fragmentShader=`varying vec3 grainPoint;
      float grainHash(vec3 p){
        p=fract(p*.1031);
        p+=dot(p,p.yzx+33.33);
        return fract((p.x+p.y)*p.z);
      }
      float grainNoise(vec3 p){
        vec3 i=floor(p),f=fract(p);
        f=f*f*(3.0-2.0*f);
        return mix(
          mix(mix(grainHash(i),grainHash(i+vec3(1,0,0)),f.x),
              mix(grainHash(i+vec3(0,1,0)),grainHash(i+vec3(1,1,0)),f.x),f.y),
          mix(mix(grainHash(i+vec3(0,0,1)),grainHash(i+vec3(1,0,1)),f.x),
              mix(grainHash(i+vec3(0,1,1)),grainHash(i+vec3(1,1,1)),f.x),f.y),f.z);
      }
      `+shader.fragmentShader.replace(
        '#include <color_fragment>',`#include <color_fragment>
        vec3 p=grainPoint*${scale.toFixed(2)};
        float broad=2.0*grainNoise(p*.14)-1.0;
        float fine=2.0*grainNoise(p)-1.0;
        float fade=1.0-smoothstep(.12,1.1,length(fwidth(p)));
        diffuseColor.rgb *= 1.0+${strength.toFixed(3)}*(broad*.68+fine*.32*fade);
      `);
    };
  }
  grain(stone,15,.09);
  const dressed=new Set();
  model.traverse(mesh=>{
    if(!mesh.isMesh||dressed.has(mesh.material))return;
    const material=mesh.material;
    dressed.add(material);
    if(/Kalkstein|Gesimse/.test(material.name))grain(material,15,.10);
    if(material.name==='Rasen')grain(material,2.6,.24);
    if(material.name==='Kies')grain(material,24,.16);
    if(material.name==='Laub'){
      grain(material,6,.20);
      material.flatShading=false;
      mesh.geometry.computeVertexNormals();
    }
    if(material.name==='Fenster')dressGlass(material);
  });
  // A layered stone surround gives the entrance a readable reveal.
  for(const x of [-1.62,1.62]){
    surface(x,2.41,12.21,.18,3.08,.32,stone);
    surface(x,1.04,12.24,.25,.34,.39,stone);
  }
  surface(0,4.02,12.21,3.46,.20,.33,stone);
  surface(0,4.16,12.27,3.64,.11,.44,stone);
  const door=new THREE.Group();
  door.position.set(-1.5,.87,12.13);
  scene.add(door);
  function detail(parent,x,y,z,w,h,d,color){
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color}));
    mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);
  }
  detail(door,1.5,1.53,0,3,3.06,.13,0x4f301b);
  for(const x of [.78,2.22])for(const y of [.62,1.64,2.54])
    detail(door,x,y,.08,1.15,.67,.06,0x654326);
  for(const x of [1.34,1.66]){
    detail(door,x,1.35,.086,.09,.25,.046,0x59472e);
    detail(door,x,1.35,.135,.044,.16,.068,0xb59760);
  }
  // The original exterior model uses a solid core. Replace it with a shell
  // around the visitor gallery and keep the upper exterior mass.
  model.getObjectByName('ResidenceSolidCore').visible=false;
  surface(0,9.35,-2,47,9.3,20,stone);
  surface(0,2.35,-11.85,47,4.7,.3,stone);
  for(const side of [-1,1])surface(side*23.35,2.35,-2,.3,4.7,20,stone);

  const plaster=new THREE.MeshStandardMaterial({color:0xe5dac6,roughness:.8});
  const walnut=new THREE.MeshStandardMaterial({color:0x62422c,roughness:.65});
  const marble=new THREE.MeshStandardMaterial({color:0xcfc5b2,roughness:.43});
  const brass=new THREE.MeshStandardMaterial({color:0xb28748,roughness:.38,metalness:.35});
  const glow=new THREE.MeshBasicMaterial({color:0xffe4ad});
  const obstacles=[];
  function partition(x,z,w,d,material){
    surface(x,2.79,z,w,3.8,d,material);
    obstacles.push({x,z,w,d});
  }
  function openingWall(x,z,width,opening,material){
    const flank=(width-opening)/2;
    for(const side of [-1,1]){
      partition(x+side*(opening+flank)/2,z,flank,.23,material);
      surface(x+side*(opening/2+.09),2.11,z,.18,2.44,.32,stone);
    }
    surface(x,3.78,z,opening,1.82,.23,material);
    surface(x,3.38,z,opening+.36,.14,.4,stone);
  }
  model.getObjectByName('ResidenceOriginalPlinth').visible=false;
  surface(0,.42,0,47.6,.84,24.6,stone);
  surface(0,.82,0,36,.14,16,marble);
  const floorCanvas=document.createElement('canvas');
  floorCanvas.width=512; floorCanvas.height=256;
  const floorPaint=floorCanvas.getContext('2d');
  for(let row=0;row<8;row++)for(let col=0;col<8;col++){
    floorPaint.fillStyle=(row+col)%2?'#e1d5bf':'#a99b87';
    floorPaint.fillRect(col*64,row*32,63,31);
  }
  const floorMap=new THREE.CanvasTexture(floorCanvas);
  floorMap.colorSpace=THREE.SRGBColorSpace;
  floorMap.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  const hallFloor=new THREE.MeshStandardMaterial({map:floorMap,roughness:.58});
  surface(0,.891,4,35.7,.008,7.7,hallFloor);
  const runner=new THREE.MeshStandardMaterial({color:0x6e242b,roughness:.94});
  surface(0,.9,4.1,32,.014,1.72,runner);

  surface(0,4.73,0,36,.12,16,plaster);
  partition(-18,0,.24,16,plaster);
  partition(18,0,.24,16,plaster);
  partition(0,-8,36,.24,plaster);
  openingWall(0,7.96,36,2.85,plaster);
  const rooms=[
    {name:'State Dining Room',x:-14.4,color:0x9f937c},
    {name:'Red Room',x:-7.2,color:0x88393d},
    {name:'Blue Room',x:0,color:0x405d85},
    {name:'Green Room',x:7.2,color:0x567062},
    {name:'East Room',x:14.4,color:0xcbb693}
  ];
  const gold=new THREE.MeshStandardMaterial({color:0xb28b4d,roughness:.47,metalness:.33});
  const hearth=new THREE.MeshStandardMaterial({color:0x251d19,roughness:.88});
  const trim=new THREE.MeshStandardMaterial({color:0xe9dcc1,roughness:.69});
  function oval(x,y,z,rx,rz,height,material){
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(1,1,height,48),material);
    mesh.position.set(x,y,z);
    mesh.scale.set(rx,1,rz);
    mesh.receiveShadow=true;
    exterior.add(mesh);
  }
  function chandelierFixture(x,z,count){
    oval(x,4.58,z,.19,.19,.075,gold);
    oval(x,4.26,z,.026,.026,.62,brass);
    const crystal=count===10?new THREE.MeshPhysicalMaterial({
      color:0xffebcf,metalness:.23,roughness:.19,clearcoat:1
    }):null;
    oval(x,3.92,z,.2,.2,.16,gold);
    if(crystal)oval(x,3.79,z,.145,.145,.095,crystal);
    for(let i=0;i<count;i++){
      const a=i*Math.PI*2/count;
      const dx=Math.cos(a), dz=Math.sin(a);
      const curve=new THREE.CatmullRomCurve3([
        new THREE.Vector3(x,3.94,z),
        new THREE.Vector3(x+dx*.29,3.78,z+dz*.29),
        new THREE.Vector3(x+dx*.55,3.94,z+dz*.55)
      ]);
      exterior.add(new THREE.Mesh(new THREE.TubeGeometry(curve,9,.018,5,false),gold));
      oval(x+dx*.55,3.95,z+dz*.55,.062,.062,.038,brass);
      oval(x+dx*.55,4.038,z+dz*.55,.019,.019,.14,crystal?trim:glow);
      if(crystal){
        oval(x+dx*.55,4.122,z+dz*.55,.012,.012,.033,glow);
        for(const [radius,height] of [[.31,3.70],[.49,3.79]]){
          const drop=new THREE.Mesh(new THREE.OctahedronGeometry(.047),crystal);
          drop.scale.set(.58,1.4,.58);
          drop.position.set(x+dx*radius,height,z+dz*radius);
          exterior.add(drop);
        }
      }
    }
  }
  function framedPanel(x,y,z,w,h,material){
    for(const side of [-1,1]){
      surface(x+side*w/2,y,z,.045,h,.07,material);
      surface(x,y+side*h/2,z,w+.045,.045,.07,material);
    }
  }
  const velvet=new THREE.MeshStandardMaterial({color:0x24466d,roughness:.96});
  grain(velvet,115,.2);
  function blueSettee(x){
    for(const side of [-1,1]){
      for(const z of [-5.8,-5.3]){
        const leg=new THREE.Mesh(new THREE.LatheGeometry([
          [.035,0],[.045,.055],[.028,.12],[.055,.21],[.06,.27]
        ].map(pair=>new THREE.Vector2(...pair)),12),gold);
        leg.position.set(x+side*.49,.89,z);
        exterior.add(leg);
      }
      oval(x+side*.53,1.36,-5.55,.071,.30,.105,gold);
      surface(x+side*.53,1.24,-5.62,.07,.23,.08,gold);
    }
    oval(x,1.18,-5.55,.59,.32,.105,gold);
    oval(x,1.27,-5.55,.55,.30,.12,velvet);
    const back=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),gold);
    back.position.set(x,1.56,-5.81);
    back.scale.set(.57,.36,.095);
    exterior.add(back);
    const cushion=new THREE.Mesh(back.geometry,velvet);
    cushion.position.set(x,1.56,-5.75);
    cushion.scale.set(.52,.31,.082);
    exterior.add(cushion);
  }
  function ovalWalls(material){
    const width=3.37, depth=3.69, count=128;
    const opening=.32;
    function band(bottom,top,inset,finish){
      const positions=[],indices=[];
      for(let i=0;i<=count;i++){
        const angle=opening+(2*Math.PI-2*opening)*i/count;
        const x=Math.sin(angle)*(width-inset);
        const z=-4+Math.cos(angle)*(depth-inset);
        positions.push(x,bottom,z,x,top,z);
        if(i<count){
          const j=i*2;
          indices.push(j,j+1,j+2,j+2,j+1,j+3);
        }
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const uv=[];
      for(let i=0;i<=count;i++)uv.push(i/count,bottom/3.79,i/count,top/3.79);
      geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
      const facing=finish===material?finish:finish.clone();
      facing.side=THREE.DoubleSide;
      const wall=new THREE.Mesh(geometry,facing);
      wall.receiveShadow=true;
      exterior.add(wall);
    }
    band(.89,4.68,0,material);
    band(.89,1.04,.055,trim);
    band(1.74,1.80,.047,trim);
    band(1.715,1.74,.034,trim);
    band(1.80,1.82,.058,trim);
    band(4.35,4.39,.026,trim);
    band(4.57,4.61,.094,trim);
    band(4.39,4.47,.045,trim);
    band(4.47,4.58,.075,trim);
    for(let i=0;i<=count;i++){
      const angle=opening+(2*Math.PI-2*opening)*i/count;
      ovalBoundary.push({x:Math.sin(angle)*width,z:-4+Math.cos(angle)*depth});
    }
  }
  const ovalBoundary=[];
  for(const [index,room] of rooms.entries()){
    const m=new THREE.MeshStandardMaterial({color:room.color,roughness:.87});
    if(index===2){
      const silk=document.createElement('canvas');
      silk.width=silk.height=256;
      const brush=silk.getContext('2d');
      brush.fillStyle='#a9bfd4';
      brush.fillRect(0,0,256,256);
      for(const [x,y] of [[64,64],[192,192]]){
        brush.save();
        brush.translate(x,y);
        for(let petal=0;petal<8;petal++){
          brush.rotate(Math.PI/4);
          brush.beginPath();
          brush.moveTo(0,3);
          brush.bezierCurveTo(-21,17,-17,43,0,52);
          brush.bezierCurveTo(17,43,21,17,0,3);
          brush.fillStyle='#bccbdd';
          brush.fill();
          brush.strokeStyle='#92abc5';
          brush.stroke();
        }
        brush.restore();
      }
      m.map=new THREE.CanvasTexture(silk);
      m.map.colorSpace=THREE.SRGBColorSpace;
      m.map.wrapS=m.map.wrapT=THREE.RepeatWrapping;
      m.map.repeat.set(21,4);
      m.color.setHex(0x587da9);
      m.roughness=.76;
    }
    openingWall(room.x,0,7.2,1.74,m);
    if(index)partition(room.x-3.6,-4,.24,8,plaster);
    if(index===2){
      ovalWalls(m);
      const textile=document.createElement('canvas');
      textile.width=textile.height=768;
      const brush=textile.getContext('2d');
      brush.fillStyle='#263d58';
      brush.fillRect(0,0,768,768);
      brush.translate(384,384);
      function ring(radius,color,width){
        brush.beginPath();
        brush.arc(0,0,radius,0,Math.PI*2);
        brush.strokeStyle=color;
        brush.lineWidth=width;

    button.onpointerup=button.onpointercancel=button.onlostpointercapture=event=>touchKeys.delete(event.pointerId);
  }
  let x=0,z=innerWidth<innerHeight?52:42,yaw=0,pitch=.08,look=null,opened=false;
  let previousX=0,previousY=0;
  const canvas=renderer.domElement;
  canvas.onpointerdown=e=>{
    if(look!==null)return;
    look=e.pointerId;previousX=e.clientX;previousY=e.clientY;canvas.setPointerCapture(look);
  };
  canvas.onpointermove=e=>{
    if(e.pointerId!==look)return;
    yaw-=(e.clientX-previousX)*.005;
    pitch=THREE.MathUtils.clamp(pitch-(e.clientY-previousY)*.005,-1.16,1.16);
    previousX=e.clientX;previousY=e.clientY;
  };
  canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(e.pointerId===look)look=null;};
  gate.onclick=()=>{opened=true;gate.hidden=true;};
  const pressed=(...names)=>names.some(key=>keys.has(key)||[...touchKeys.values()].includes(key));
  function valid(px,pz){
    if(Math.abs(px)>31||pz>53||pz< -7.8)return false;
    if(pz>=7.96&&pz<12.43&&(Math.abs(px)>1.23||door.rotation.y<1.45))return false;
    if(pz<8&&Math.abs(px)>17.8)return false;
    if(ovalBoundary.some(point=>Math.hypot(px-point.x,pz-point.z)<.33))return false;
    if(obstacles.some(({x,z,w,d})=>Math.abs(px-x)<w/2+.21&&Math.abs(pz-z)<d/2+.21))return false;
    if(pz>12.75&&pz<17.75&&Math.abs(Math.abs(px)-7.7)<.42)return false;
    return bounds.every(([cx,cz])=>Math.hypot(px-cx,pz-cz)>.98);
  }
  function ground(px,pz){
    if(pz<12.04)return .89;
    if(Math.abs(px)>8.5||pz>20.55)return .03;
    if(pz<19.31)return .86;
    return .86-.166*Math.min(4,Math.ceil((pz-19.31)/.31));
  }
  let last=performance.now(),eye=1.68;
  renderer.setAnimationLoop(now=>{
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const f=Number(pressed('w','arrowup'))-Number(pressed('s','arrowdown'));
    const s=Number(pressed('d','arrowright'))-Number(pressed('a','arrowleft'));
    const speed=2.8*dt/Math.max(1,Math.hypot(f,s));
    const nx=x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*speed;
    const nz=z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;
    if(valid(nx,z))x=nx;
    if(valid(x,nz))z=nz;
    if(opened)door.rotation.y=Math.min(1.61,door.rotation.y+dt*1.9);
    gate.hidden=opened||z>14.3||Math.abs(x)>1.25;
    eye=THREE.MathUtils.lerp(eye,ground(x,z)+1.65,1-Math.exp(-dt*14));
    camera.position.set(x,eye,z);
    camera.rotation.set(pitch,yaw,0,'YXZ');
    place.textContent=z<-.25?rooms[Math.min(4,Math.floor((x+18)/7.2))].name:z<7.8?'Cross Hall':z<12?'Vestibül':z<19?'Säulenvorbau':'Nordfassade · Pfeile oder WASD';
    sky.position.copy(camera.position);
    sky.material.uniforms.drift.value+=dt*.022;
    renderer.render(scene,camera);
  });
  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
  });
}
</script>
</html>
