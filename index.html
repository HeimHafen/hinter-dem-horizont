<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinter dem Horizont</title>
<style>
body{margin:0;background:#17201e;color:#f6efdf;font:1rem system-ui,sans-serif}
main{max-width:64rem;margin:auto;padding:clamp(1rem,5vw,3rem)}
h1{font:clamp(2rem,7vw,4rem) Georgia,serif;margin:0 0 .5rem}
model-viewer{display:block;width:100%;height:65vh;min-height:22rem;background:#e7e0d1;border-radius:1rem}
p{color:#ded7c8}
</style>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<main>
<h1>Hinter dem Horizont</h1>
<p>Felsenburg · 3D-Ansicht</p>
<model-viewer src="./Felsenburg.glb" alt="Felsenburg mit Freitreppe und Schiefertürmen" camera-controls camera-orbit="0deg 78deg auto" shadow-intensity="0.8" touch-action="pan-y"></model-viewer>
<p>Zum Drehen ziehen. Zum Zoomen zwei Finger verwenden.</p>
</main>
</html>
